[project]
name = "tdt-ephyviewer-explorer"
version = "0.1.0"
description = "Data exploration app for TDT recordings built on a custom ephyviewer fork"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "ephyviewer @ git+https://github.com/rdarie/ephyviewer.git@master",
    "tdt",
    "PySide6",
    "numpy",
    "pandas",
    "hydra-core",
    "probeinterface",
    "pyqtgraph",
]

[project.scripts]
tdt-explore = "tdt_ephyviewer_explorer.app:main"

[dependency-groups]
dev = [
    "pytest",
]

# Dev mode: use a local editable checkout of ephyviewer, expected as a sibling
# directory (../ephyviewer). The path is relative to this pyproject.toml, so it is
# portable across machines that follow that layout — no absolute paths.
#   uv sync              -> ephyviewer from ../ephyviewer (editable)
#   uv sync --no-sources -> ephyviewer from the git fork (@master), no local checkout needed
[tool.uv.sources]
ephyviewer = { path = "../ephyviewer", editable = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
