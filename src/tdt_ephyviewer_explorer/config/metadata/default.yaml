# @package _global_
# Settings for the tdt-metadata browser.
metadata:
  # Sidecar file for post-hoc annotations, written into the block's tdt_explore/
  # subfolder (raw Synapse files are never touched).
  analysis_notes_filename: analysis_notes.txt
  stim:
    # fnmatch pattern for the stim parameter store (eS1p, eS2p, …).
    store_pattern: "eS?p"
    # Named column schema (see schema/default.yaml) giving the store's row order.
    schema: iz_param_names
    # Voice suffixes appended to each parameter name (perA, countA, …).
    voices: [A, B, C, D]
    # Column prefixes: a voice is stimulating at an event when chan{V} > 0 and
    # amp{V} != 0 (amplitudes are stored negative for cathodic pulses). count{V} is
    # pulses per train, per{V} the within-train interval.
    chan_prefix: chan
    count_prefix: count
    amp_prefix: amp
    per_prefix: per
    # freq_Hz = per_to_hz / per{V}. per is in milliseconds.
    per_to_hz: 1000.0
    # Amplitude unit label. Display only; no conversion is applied.
    amp_units: "µA"
    # Channel tokens listed per voice before the list truncates to a count.
    max_channels_listed: 5
