# @package _global_
viewers:
  trace:
    scale_mode: real_scale
    display_labels: true
    antialias: true
  timefreq:
    show_axis: true
  spectrogram: {}
  eventlist: {}
  spiketrain: {}
  epoch: {}
  epochencoder: {}
  impedance:
    vmin: 0.0                  # kOhm
    vmax: 200.0                # kOhm; values outside [vmin, vmax] clamp to the end colors
    annotate: true
    annotation_format: "R{channel}\n{impedance:.0f}"
    cmap: viridis
